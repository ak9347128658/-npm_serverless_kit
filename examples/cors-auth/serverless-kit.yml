service: api
framework: serverless-kit

provider:
  name: aws
  runtime: nodejs20
  region: us-east-1
  stage: dev

functions:
  items:
    handler: src/handler.handler
    description: Public CORS route and an IAM route
    events:
      - http:
          path: /items
          method: get
          auth: public
          cors: true
      - http:
          path: /items
          method: post
          auth: iam
          cors: true
